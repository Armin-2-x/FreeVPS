
name: Windows VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup Windows VPS
        shell: powershell
        env:
          VPS_USERNAME: ${{ secrets.LINUX_USERNAME }}
          VPS_PASSWORD: ${{ secrets.LINUX_USER_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Windows VPS Setup ==="

          $username = $env:VPS_USERNAME
          $password = $env:VPS_PASSWORD
          $authKey = $env:TS_AUTHKEY

          if ([string]::IsNullOrWhiteSpace($username)) {
            throw "Missing LINUX_USERNAME secret."
          }

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "Missing LINUX_USER_PASSWORD secret."
          }

          if ([string]::IsNullOrWhiteSpace($authKey)) {
            throw "Missing TS_AUTHKEY secret."
          }

          if ($username -match '[\\/:*?"<>|]') {
            throw "Invalid username format."
          }

          if ($password.Length -lt 8) {
            throw "Password is too short."
          }

          if ($password -match [regex]::Escape($username)) {
            throw "Password must not contain the username."
          }

          Write-Host "Password length: $($password.Length)"
          Write-Host "Preparing local Windows account..."

          $securePassword = ConvertTo-SecureString `
            -String $password `
            -AsPlainText `
            -Force

          try {
            $user = Get-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -ErrorAction Stop | Out-Null
            }
            else {
              Set-LocalUser `
                -Name $username `
                -Password $securePassword `
                -ErrorAction Stop
            }

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $username `
              -ErrorAction Stop

            Write-Host "Windows account configured."
          }
          catch {
            Write-Error "Account setup failed. Check password policy and account settings."
            throw
          }

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Installing Tailscale..."

          $installer = Join-Path $env:TEMP "tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer `
            -ErrorAction Stop

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait `
            -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installer failed with exit code $($process.ExitCode)."
          }

          $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            "--auth-key=$authKey" `
            "--hostname=github-windows-vps"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 3
            $ip = & $tailscale ip -4

            if ($LASTEXITCODE -eq 0 -and $ip) {
              break
            }
          }

          if (-not $ip) {
            throw "Could not obtain a Tailscale IPv4 address."
          }

          Write-Host "================================"
          Write-Host "Windows VPS setup completed."
          Write-Host "Username: $username"
          Write-Host "Tailscale IPv4: $ip"
          Write-Host "RDP port: 3389"
          Write-Host "================================"

          while ($true) {
            Start-Sleep -Seconds 60
          }
