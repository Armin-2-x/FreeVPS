name: Windows VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup Windows VPS
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Windows VPS Runner"
          Write-Host "=========================================="

          $username = "${{ secrets.LINUX_USERNAME }}"
          $password = "${{ secrets.LINUX_USER_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($username)) {
            Write-Error "LINUX_USERNAME secret is missing"
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($password)) {
            Write-Error "LINUX_USER_PASSWORD secret is missing"
            exit 1
          }

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host ""
          Write-Host "Windows VPS is ready."
          Write-Host "Username: $username"
          Write-Host ""
          Write-Host "The GitHub Actions runner is temporary."
          Write-Host "Keeping the job alive..."

          while ($true) {
            Start-Sleep -Seconds 60
          }
